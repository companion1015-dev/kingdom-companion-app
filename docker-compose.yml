# Local dev LiveKit server — lets you run the whole stack (host publishes,
# viewer watches) on your machine with zero cloud account. Not for
# production (Section 16: Security expects a real TLS-terminated deployment
# or LiveKit Cloud). Matches LIVEKIT_URL=ws://localhost:7880 in server/.env.
#
# Usage:
#   docker compose up
#   # then in server/.env: LIVEKIT_API_KEY=devkey / LIVEKIT_API_SECRET=devsecret1234567890
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # signaling (WS)
      - "7881:7881" # RTC TCP fallback
      - "50000-50100:50000-50100/udp" # media (narrow this range in prod)
    environment:
      LIVEKIT_KEYS: "devkey: devsecret1234567890"
